<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecno Chile - Inventario</title>
    <link rel="icon" type="image/x-icon" href="assets/img/detective.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <img class="nav__logo" src="assets/images/logo/TecnoChile_blanco.svg" alt="Logotipo Tecno Chile">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                    aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarText">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Inventario</a></li>
                        <li class="nav-item ms-3">
                            <button class="btn btn-light position-relative" type="button" data-bs-toggle="offcanvas"
                                data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas">
                                <i class="fa-solid fa-cart-shopping"></i>
                                <span id="cartItemsCountBadge"
                                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestión de Inventario</h2>
            <div>
                <select id="filterCategory" class="form-select d-inline-block w-auto">
                    <option value="todos">Todas las Categorías</option>
                    <option value="mouses">Mouses</option>
                    <option value="teclados">Teclados</option>
                    <option value="monitores">Monitores</option>
                </select>
                <button id="addProductBtn" class="btn btn-success ms-2">Agregar Producto</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover" id="inventoryTable">
                <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Imagen</th>
                        <th>Editar</th>
                        <th>Guardar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas de productos aqui -->
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <p class="footer__title">Desarrolladores:</p>
        <ul class="footer__content">
            <li><a href="#">Camila Collado</a></li>
            <li><a href="#">Daniel Paredes</a></li>
            <li><a href="#">Jesús Pérez</a></li>
        </ul>
        <div class="footer__social">
            <a href="#"><img src="assets/images/footer/facebook.svg" alt="Facebook"></a>
            <a href="#"><img src="assets/images/footer/instagram.svg" alt="Instagram"></a>
            <a href="#"><img src="assets/images/footer/twitch.svg" alt="Twitch"></a>
            <a href="#"><img src="assets/images/footer/twitter.svg" alt="Twitter"></a>
        </div>
        <p>© 2025 Tienda Digital. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/gestionInventario.js"></script>
</body>

</html>
